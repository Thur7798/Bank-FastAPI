version: "3.3"

services:
  api:
    build: .
    container_name: bank_api
    ports:
      - "8080:8000"
    environment:
      - DB_HOST=db
      - DB_USER=usuario
      - DB_PASS=senha
      - DB_NAME=bankdb
      - CACHE_HOST=cache
    volumes:
      - ./logs:/app/logs
    depends_on:
      - db
      - cache

  db:
    image: postgres:15
    container_name: bank_db
    environment:
      - POSTGRES_USER=usuario
      - POSTGRES_PASSWORD=senha
      - POSTGRES_DB=bankdb
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  cache:
    image: redis:7
    container_name: bank_cache
    ports:
      - "6379:6379"

volumes:
  db_data:
